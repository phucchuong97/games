<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boggle</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#1a1a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: #1a1a2e;
  color: #e0e0e0;
  font-family: "Segoe UI", system-ui, sans-serif;
  padding: 20px 12px 40px;
  gap: 14px;
}
h1 { margin: 0; color: #4ade80; letter-spacing: 3px; font-size: 26px; }

#top-bar {
  display: flex;
  gap: 24px;
  align-items: center;
  color: #94a3b8;
  font-size: 14px;
}
#timer { font-size: 22px; font-weight: bold; color: #4ade80; min-width: 48px; text-align: center; }
#timer.urgent { color: #f87171; }
#score-display { font-size: 18px; font-weight: bold; color: #e0e0e0; }
#high-display { font-size: 13px; color: #94a3b8; }

/* Grid */
#grid-container {
  display: grid;
  grid-template-columns: repeat(4, 72px);
  grid-template-rows: repeat(4, 72px);
  gap: 6px;
  background: #16213e;
  border: 2px solid #0f3460;
  border-radius: 12px;
  padding: 12px;
}
.cell {
  width: 72px; height: 72px;
  background: #1a1a2e;
  border: 2px solid #0f3460;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; font-weight: bold;
  cursor: pointer;
  user-select: none;
  transition: background 0.1s, border-color 0.1s, color 0.1s, transform 0.1s;
  color: #e0e0e0;
  position: relative;
}
.cell:hover { border-color: #4ade80; }
.cell.selected { border-color: #4ade80; color: #16213e; transform: scale(1.05); }
.cell.adjacent-hint { border-color: #22c55e; opacity: 0.7; }
.cell .seq-num {
  position: absolute;
  top: 3px; right: 5px;
  font-size: 10px;
  font-weight: bold;
  color: rgba(255,255,255,0.6);
}

/* Input row */
#input-row {
  display: flex;
  gap: 8px;
  align-items: center;
}
#word-input {
  background: #16213e;
  border: 2px solid #0f3460;
  border-radius: 6px;
  color: #e0e0e0;
  font-size: 18px;
  font-weight: bold;
  padding: 8px 14px;
  width: 200px;
  letter-spacing: 3px;
  text-transform: uppercase;
  outline: none;
  caret-color: #4ade80;
}
#word-input:focus { border-color: #4ade80; }
#word-input.error { border-color: #f87171; animation: shake 0.3s; }
#word-input.success { border-color: #4ade80; }

@keyframes shake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}

button {
  background: #4ade80;
  color: #16213e;
  border: none;
  border-radius: 6px;
  padding: 8px 18px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.15s;
}
button:hover { background: #22c55e; }
button:disabled { background: #94a3b8; cursor: default; }
#clear-btn { background: #0f3460; color: #94a3b8; }
#clear-btn:hover { background: #1a3a6e; color: #e0e0e0; }

#error-msg {
  font-size: 13px;
  min-height: 18px;
  color: #f87171;
  text-align: center;
}

/* Found words */
#found-panel {
  background: #16213e;
  border: 1px solid #0f3460;
  border-radius: 10px;
  padding: 12px 16px;
  width: 100%;
  max-width: 400px;
}
#found-panel h3 { margin: 0 0 8px; font-size: 14px; color: #94a3b8; }
#found-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  max-height: 120px;
  overflow-y: auto;
}
.found-word {
  background: #0f3460;
  border-radius: 4px;
  padding: 3px 8px;
  font-size: 12px;
  color: #4ade80;
  font-weight: bold;
}
.found-word .pts { color: #94a3b8; font-size: 10px; margin-left: 3px; }

/* Overlay */
#overlay {
  position: fixed; inset: 0;
  background: rgba(10,10,20,0.9);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
}
#overlay-box {
  background: #16213e;
  border: 2px solid #0f3460;
  border-radius: 14px;
  padding: 36px 40px;
  text-align: center;
  max-width: 460px;
  width: 92%;
}
#overlay-box h2 { margin: 0 0 6px; color: #4ade80; font-size: 22px; letter-spacing: 2px; }
#overlay-box .sub { color: #94a3b8; margin: 0 0 24px; font-size: 14px; }
#overlay-btn { padding: 12px 32px; font-size: 15px; }
#end-stats { margin-bottom: 20px; }
#end-stats .stat { margin: 6px 0; font-size: 15px; }
#end-stats .stat span { color: #4ade80; font-weight: bold; }
#missed-words {
  text-align: left;
  background: #0f3460;
  border-radius: 8px;
  padding: 10px 14px;
  margin: 12px 0;
  max-height: 140px;
  overflow-y: auto;
  font-size: 13px;
}
#missed-words h4 { margin: 0 0 6px; color: #94a3b8; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
#missed-list { display: flex; flex-wrap: wrap; gap: 5px; }
.missed-word { color: #f87171; font-size: 12px; }
</style>

const WORD_SET = new Set(WORD_LIST_RAW.split(/\s+/).map(w => w.trim().toUpperCase()).filter(w => w.length >= 3));

// Scoring
function scoreWord(w) {
  const n = w.length;
  if (n <= 4) return 1;
  if (n === 5) return 2;
  if (n === 6) return 3;
  if (n === 7) return 5;
  return 11;
}

// Weighted letters (Scrabble-inspired distribution)
const LETTER_POOL = 'AAAAAAAAABBCCDDDDEEEEEEEEEEEEFFGGGHHIIIIIIIIIJKLLLLMMNNNNNNOOOOOOOOPPQRRRRRRSSSSTTTTTTUUUUVVWWXYYZ';

// Grid state
let board = [];       // 16 letters
let selectedCells = [];  // indices of clicked cells
let foundWords = new Set();
let score = 0;
let timerVal = 180;
let timerInterval = null;
let gameActive = false;
let highScore = parseInt(localStorage.getItem('boggleHigh') || '0');

document.getElementById('high-val').textContent = highScore;

// Build DOM grid
const gridEl = document.getElementById('grid-container');
const cells = [];
for (let i = 0; i < 16; i++) {
  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.dataset.idx = i;
  cell.addEventListener('click', () => onCellClick(i));
  gridEl.appendChild(cell);
  cells.push(cell);
}

function generateBoard() {
  board = [];
  for (let i = 0; i < 16; i++) {
    board.push(LETTER_POOL[Math.floor(Math.random() * LETTER_POOL.length)]);
  }
  // Ensure at least 2 vowels (AEIOU)
  const vowels = 'AEIOU';
  let vowelCount = board.filter(l => vowels.includes(l)).length;
  while (vowelCount < 3) {
    const idx = Math.floor(Math.random() * 16);
    if (!vowels.includes(board[idx])) {
      board[idx] = vowels[Math.floor(Math.random() * vowels.length)];
      vowelCount++;
    }
  }
  renderBoard();
}

function renderBoard() {
  cells.forEach((cell, i) => {
    cell.textContent = board[i];
    cell.className = 'cell';
    // Remove seq-num
    const sn = cell.querySelector('.seq-num');
    if (sn) sn.remove();
  });
}

function getRow(i) { return Math.floor(i / 4); }
function getCol(i) { return i % 4; }

function isAdjacent(a, b) {
  return Math.abs(getRow(a) - getRow(b)) <= 1 && Math.abs(getCol(a) - getCol(b)) <= 1 && a !== b;
}

function onCellClick(idx) {
  if (!gameActive) return;
  const input = document.getElementById('word-input');

  if (selectedCells.includes(idx)) {
    // Clicking a cell that's already selected: if it's the last one, deselect it
    if (selectedCells[selectedCells.length - 1] === idx) {
      selectedCells.pop();
      input.value = selectedCells.map(i => board[i]).join('');
      updateCellStyles();
    }
    return;
  }

  // Must be adjacent to last selected cell
  if (selectedCells.length > 0) {
    const last = selectedCells[selectedCells.length - 1];
    if (!isAdjacent(last, idx)) {
      flashError('Letters must be adjacent!');
      return;
    }
  }

  selectedCells.push(idx);
  input.value = selectedCells.map(i => board[i]).join('');
  updateCellStyles();
}

function updateCellStyles() {
  const n = selectedCells.length;
  cells.forEach((cell, i) => {
    cell.className = 'cell';
    const sn = cell.querySelector('.seq-num');
    if (sn) sn.remove();
  });

  selectedCells.forEach((idx, pos) => {
    const cell = cells[idx];
    // Color gradient from #4ade80 (start) to #22c55e (end)
    const t = n > 1 ? pos / (n - 1) : 0;
    const r = Math.round(74 + (34 - 74) * t);
    const g = Math.round(222 + (197 - 222) * t);
    const b = Math.round(128 + (94 - 128) * t);
    cell.style.background = `rgb(${r},${g},${b})`;
    cell.style.borderColor = '#4ade80';
    cell.style.color = '#16213e';
    cell.style.transform = 'scale(1.07)';

    const sn = document.createElement('span');
    sn.className = 'seq-num';
    sn.textContent = pos + 1;
    cell.appendChild(sn);
  });

  // Highlight adjacent cells (potential next picks)
  if (n > 0) {
    const last = selectedCells[n - 1];
    for (let i = 0; i < 16; i++) {
      if (!selectedCells.includes(i) && isAdjacent(last, i)) {
        cells[i].classList.add('adjacent-hint');
      }
    }
  }
}

function clearSelection() {
  selectedCells = [];
  document.getElementById('word-input').value = '';
  renderBoard();
  clearError();
}

// Keyboard input handling
document.getElementById('word-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitWord();
  if (e.key === 'Escape') clearSelection();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && gameActive) clearSelection();
});

document.getElementById('submit-btn').addEventListener('click', submitWord);
document.getElementById('clear-btn').addEventListener('click', clearSelection);

function submitWord() {
  if (!gameActive) return;
  const input = document.getElementById('word-input');
  const word = input.value.toUpperCase().trim();

  if (word.length < 3) { flashError('Words must be at least 3 letters!'); return; }
  if (foundWords.has(word)) { flashError('Already found!'); return; }
  if (!WORD_SET.has(word)) { flashError('Not in word list!'); return; }

  // Validate path on board
  const path = findPath(word);
  if (!path) { flashError('Cannot make that word on the board!'); return; }

  // Valid!
  foundWords.add(word);
  const pts = scoreWord(word);
  score += pts;

  document.getElementById('score-display').textContent = score;
  addFoundWord(word, pts);
  clearSelection();
  clearError();

  // Flash success
  input.classList.add('success');
  setTimeout(() => input.classList.remove('success'), 600);
}

function findPath(word) {
  // DFS to find a valid path for the word
  for (let start = 0; start < 16; start++) {
    if (board[start] !== word[0]) continue;
    const result = dfs(word, 1, [start]);
    if (result) return result;
  }
  return null;
}

function dfs(word, pos, path) {
  if (pos === word.length) return path;
  const last = path[path.length - 1];
  for (let next = 0; next < 16; next++) {
    if (path.includes(next)) continue;
    if (!isAdjacent(last, next)) continue;
    if (board[next] !== word[pos]) continue;
    const result = dfs(word, pos + 1, [...path, next]);
    if (result) return result;
  }
  return null;
}

function addFoundWord(word, pts) {
  const list = document.getElementById('found-list');
  const item = document.createElement('div');
  item.className = 'found-word';
  item.innerHTML = word + `<span class="pts">+${pts}</span>`;
  list.prepend(item);
  document.getElementById('found-count').textContent = foundWords.size;
}

function flashError(msg) {
  const input = document.getElementById('word-input');
  const errEl = document.getElementById('error-msg');
  errEl.textContent = msg;
  input.classList.add('error');
  setTimeout(() => {
    input.classList.remove('error');
  }, 400);
}

function clearError() {
  document.getElementById('error-msg').textContent = '';
}

// Timer
function startTimer() {
  timerVal = 180;
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timerVal--;
    updateTimerDisplay();
    if (timerVal <= 0) {
      clearInterval(timerInterval);
      endGame();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const el = document.getElementById('timer');
  const m = Math.floor(timerVal / 60);
  const s = timerVal % 60;
  el.textContent = m + ':' + String(s).padStart(2, '0');
  el.classList.toggle('urgent', timerVal <= 30);
}

// Find all possible words on board (for end screen)
function findAllBoardWords() {
  const possible = new Set();
  // Build trie for prefix checking
  const trie = buildTrie();

  for (let start = 0; start < 16; start++) {
    dfsBoardAll(start, [start], board[start], trie.root, possible);
  }
  return possible;
}

function buildTrie() {
  const root = {};
  for (const word of WORD_SET) {
    let node = root;
    for (const ch of word) {
      if (!node[ch]) node[ch] = {};
      node = node[ch];
    }
    node['$'] = true;
  }
  return { root };
}

function dfsBoardAll(idx, path, current, trieNode, result) {
  const node = trieNode[board[idx]];
  if (!node) return;
  if (node['$'] && current.length >= 3) result.add(current);

  for (let next = 0; next < 16; next++) {
    if (path.includes(next)) continue;
    if (!isAdjacent(idx, next)) continue;
    if (!node[board[next]]) continue;
    dfsBoardAll(next, [...path, next], current + board[next], node, result);
  }
}

function endGame() {
  gameActive = false;
  clearSelection();

  if (score > highScore) {
    highScore = score;
    localStorage.setItem('boggleHigh', highScore);
    document.getElementById('high-val').textContent = highScore;
  }

  const allPossible = findAllBoardWords();
  const missed = [...allPossible].filter(w => !foundWords.has(w))
    .sort((a, b) => scoreWord(b) - scoreWord(a) || b.length - a.length)
    .slice(0, 20);

  const statsEl = document.getElementById('end-stats');
  statsEl.innerHTML = `
    <div class="stat">Score: <span>${score}</span></div>
    <div class="stat">Words Found: <span>${foundWords.size}</span></div>
    <div class="stat">Possible Words: <span>${allPossible.size}</span></div>
    ${score >= highScore ? '<div class="stat" style="color:#4ade80">🏆 New High Score!</div>' : `<div class="stat">Best Score: <span>${highScore}</span></div>`}
  `;
  statsEl.style.display = 'block';

  if (missed.length > 0) {
    const missedList = document.getElementById('missed-list');
    missedList.innerHTML = missed.map(w => `<span class="missed-word">${w}(${scoreWord(w)})</span>`).join(' ');
    document.getElementById('missed-words').style.display = 'block';
  } else {
    document.getElementById('missed-words').style.display = 'none';
  }

  document.getElementById('overlay-box').querySelector('h2').textContent = 'Time\'s Up!';
  document.getElementById('overlay-box').querySelector('.sub').textContent = '';
  document.getElementById('overlay').style.display = 'flex';
}

function startGame() {
  clearInterval(timerInterval);
  score = 0;
  foundWords = new Set();
  selectedCells = [];

  document.getElementById('score-display').textContent = 0;
  document.getElementById('found-list').innerHTML = '';
  document.getElementById('found-count').textContent = 0;
  document.getElementById('word-input').value = '';
  document.getElementById('error-msg').textContent = '';
  document.getElementById('end-stats').style.display = 'none';
  document.getElementById('missed-words').style.display = 'none';
  document.getElementById('overlay-box').querySelector('h2').textContent = 'BOGGLE';
  document.getElementById('overlay-box').querySelector('.sub').textContent = 'Find words in the 4×4 grid.\nConnect adjacent letters (including diagonals).\nMin 3 letters. 3 minutes. Good luck!';

  generateBoard();
  gameActive = true;
  startTimer();

  document.getElementById('overlay').style.display = 'none';
}

document.getElementById('overlay-btn').addEventListener('click', startGame);
</script>
