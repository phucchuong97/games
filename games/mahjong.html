<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahjong Solitaire</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #1a1a2e; color: #e0e0e0;
  font-family: "Segoe UI", system-ui, sans-serif;
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-start;
  padding: 24px 20px 32px;
}
a.back { position: fixed; top: 12px; left: 12px; color: #94a3b8; text-decoration: none; font-size: 13px; }
a.back:hover { color: #e0e0e0; }

/* Overlay */
#overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.85);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999;
}
.panel {
  background: #16213e; border: 2px solid #0f3460;
  border-radius: 12px; padding: 36px 48px;
  text-align: center; min-width: 280px; max-width: 420px;
}
.panel h2 { font-size: 26px; color: #4ade80; letter-spacing: 2px; margin-bottom: 10px; }
.panel p { color: #94a3b8; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
button.btn {
  background: #4ade80; color: #16213e; font-weight: bold;
  border: none; border-radius: 6px; padding: 10px 28px;
  font-size: 15px; cursor: pointer; transition: background 0.15s; margin: 4px;
}
button.btn:hover { background: #22c55e; }
button.btn.secondary {
  background: #16213e; color: #94a3b8; border: 1px solid #0f3460;
}
button.btn.secondary:hover { border-color: #4ade80; color: #4ade80; }

/* HUD */
#hud {
  display: flex; align-items: center; gap: 20px;
  margin-bottom: 16px; flex-wrap: wrap; justify-content: center;
}
.hud-box {
  background: #16213e; border: 1px solid #0f3460;
  border-radius: 8px; padding: 6px 16px; text-align: center;
}
.hud-box .label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
.hud-box .num { font-size: 20px; font-weight: bold; color: #4ade80; }
#status-msg { font-size: 14px; color: #94a3b8; }

/* Board wrapper */
#board-outer {
  overflow-x: auto; overflow-y: hidden;
  max-width: 100vw; margin-bottom: 16px;
  padding: 8px; background: #0f1f3d;
  border: 2px solid #0f3460; border-radius: 10px;
}
#mahjong-board {
  position: relative;
  /* dimensions set by JS */
}

/* Tiles */
.tile {
  position: absolute;
  width: 44px; height: 58px;
  background: linear-gradient(145deg, #f5e8cc 0%, #d4b896 100%);
  border: 2px solid #a08050;
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700;
  cursor: pointer; user-select: none;
  box-shadow: 2px 2px 0 #70502a, 3px 3px 7px rgba(0,0,0,0.45);
  transition: transform 0.1s;
  line-height: 1.2;
}
.tile:not(.locked):hover { transform: translateY(-2px) scale(1.04); }
.tile.locked {
  cursor: not-allowed;
  filter: brightness(0.72) saturate(0.5);
}
.tile.selected {
  background: linear-gradient(145deg, #d0f0df 0%, #96d8b0 100%);
  border-color: #4ade80;
  box-shadow: 0 0 0 2px #4ade80, 2px 2px 0 #2a7a4e;
}
.tile.hinted {
  border-color: #fbbf24 !important;
  box-shadow: 0 0 8px 3px rgba(251,191,36,0.55), 2px 2px 0 #70502a !important;
  animation: hint-pulse 0.75s ease-in-out infinite alternate;
}
@keyframes hint-pulse {
  to { box-shadow: 0 0 14px 5px rgba(251,191,36,0.8), 2px 2px 0 #70502a; }
}
.tile .tile-suit {
  position: absolute; top: 2px; left: 3px;
  font-size: 9px; font-weight: 600; opacity: 0.65;
}
.tile .tile-val { font-size: 15px; }

/* Remove animation */
@keyframes fadeOut {
  from { opacity: 1; transform: scale(1); }
  to   { opacity: 0; transform: scale(0.5); }
}
.tile.removing { animation: fadeOut 0.25s forwards; pointer-events: none; }

/* Controls */
#controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
button.btn-sm {
  background: #4ade80; color: #16213e; font-weight: bold;
  border: none; border-radius: 6px; padding: 8px 18px;
  font-size: 14px; cursor: pointer; transition: background 0.15s;
}
button.btn-sm:hover { background: #22c55e; }
button.btn-sm.secondary {
  background: #16213e; color: #94a3b8; border: 1px solid #0f3460;
}
button.btn-sm.secondary:hover { border-color: #4ade80; color: #4ade80; }
</style>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>
<a href="../index.html" class="back">← Back</a>

<!-- Start overlay -->
<div id="overlay">
  <div class="panel">
    <h2>MAHJONG SOLITAIRE</h2>
    <p>Match free pairs of identical tiles to clear the board.<br>
    A tile is <em>free</em> if nothing rests on top of it and at least one side is open.</p>
    <p style="color:#fbbf24;font-size:13px">Flowers match any flower · Seasons match any season</p>
    <button class="btn" onclick="startGame()">Start Game</button>
  </div>
</div>

<!-- HUD -->
<div id="hud">
  <div class="hud-box">
    <div class="label">Pairs Left</div>
    <div class="num" id="pairs-left">72</div>
  </div>
  <div class="hud-box">
    <div class="label">Moves</div>
    <div class="num" id="move-count">0</div>
  </div>
  <div id="status-msg">Select a free tile</div>
</div>

<!-- Board -->
<div id="board-outer">
  <div id="mahjong-board"></div>
</div>

<!-- Controls -->
<div id="controls">
  <button class="btn-sm" onclick="newGame()">New Game</button>
  <button class="btn-sm secondary" onclick="showHint()">Hint</button>
  <button class="btn-sm secondary" onclick="doShuffle()">Shuffle</button>
</div>

<script>
// ── Constants ──────────────────────────────────────────────────
const TILE_W = 44, TILE_H = 58, TILE_GAP = 3;
const CELL_W = TILE_W + TILE_GAP;  // 47
const CELL_H = TILE_H + TILE_GAP;  // 61
const LAYER_DX = 4, LAYER_DY = 4;  // pixel offset per layer
const MAX_Z = 4;
const TOP_OFFSET = MAX_Z * LAYER_DY; // 16px top padding

// ── Layout (144 positions) ─────────────────────────────────────
function buildLayout() {
  const pos = [];
  // z=0: 12×6 base (72)
  for (let r = 0; r < 6; r++)
    for (let c = 0; c < 12; c++)
      pos.push([c, r, 0]);
  // z=1: 10×4 (40)
  for (let r = 1; r <= 4; r++)
    for (let c = 1; c <= 10; c++)
      pos.push([c, r, 1]);
  // z=2: 8×3 (24)
  for (let r = 2; r <= 4; r++)
    for (let c = 2; c <= 9; c++)
      pos.push([c, r, 2]);
  // z=3: 6×1 (6)
  for (let c = 3; c <= 8; c++)
    pos.push([c, 3, 3]);
  // z=4: 2×1 (2)
  pos.push([5, 3, 4]);
  pos.push([6, 3, 4]);
  // Total: 72+40+24+6+2 = 144
  return pos;
}
const ALL_POSITIONS = buildLayout();

// ── Tile set (144 tiles) ───────────────────────────────────────
function generateTileSet() {
  const tiles = [];
  let uid = 0;

  // Suit tiles × 4
  const suits = [
    { group:'bamboo', prefix:'B', textFn: v=>`B${v}`, color:'#14532d', suit:'BM' },
    { group:'circles', prefix:'C', textFn: v=>`C${v}`, color:'#1e3a8a', suit:'CI' },
    { group:'chars', prefix:'M', textFn: v=>`万${v}`, color:'#7f1d1d', suit:'CH' },
  ];
  for (const s of suits)
    for (let v = 1; v <= 9; v++)
      for (let k = 0; k < 4; k++)
        tiles.push({ uid: uid++, group: s.group, key: `${s.prefix}${v}`,
                     text: s.textFn(v), color: s.color, suit: s.suit });

  // Wind tiles × 4
  for (const [text, key] of [['東','WE'],['南','WS'],['西','WW'],['北','WN']])
    for (let k = 0; k < 4; k++)
      tiles.push({ uid: uid++, group:'wind', key, text, color:'#334155', suit:'WI' });

  // Dragon tiles × 4
  for (const [text, key, color] of [['中','D中','#991b1b'],['發','D發','#14532d'],['白','D白','#475569']])
    for (let k = 0; k < 4; k++)
      tiles.push({ uid: uid++, group:'dragon', key, text, color, suit:'DR' });

  // Flowers × 1 each (match any flower)
  for (let v = 1; v <= 4; v++)
    tiles.push({ uid: uid++, group:'flower', key:`F${v}`, text:`F${v}`, color:'#6d28d9', suit:'FL' });

  // Seasons × 1 each (match any season)
  for (let v = 1; v <= 4; v++)
    tiles.push({ uid: uid++, group:'season', key:`S${v}`, text:`S${v}`, color:'#0e7490', suit:'SE' });

  return tiles; // 144
}
const TILE_SET = generateTileSet();

// ── State ──────────────────────────────────────────────────────
let board; // Map<posKey, tile>
let selected; // posKey or null
let moves;
let hintPair; // [posKey, posKey] or null

const pk = (c,r,z) => `${c},${r},${z}`;
const pkParse = k => k.split(',').map(Number); // [c,r,z]

// ── Core Logic ─────────────────────────────────────────────────
function isFree(c, r, z) {
  if (board.has(pk(c, r, z+1))) return false;          // blocked above
  const leftFree  = !board.has(pk(c-1, r, z));
  const rightFree = !board.has(pk(c+1, r, z));
  return leftFree || rightFree;
}

function tilesMatch(a, b) {
  if (a.uid === b.uid) return false;
  if (a.group === 'flower' && b.group === 'flower') return true;
  if (a.group === 'season' && b.group === 'season') return true;
  return a.key === b.key;
}

function findHintPair() {
  const free = [];
  for (const [key, tile] of board.entries()) {
    const [c,r,z] = pkParse(key);
    if (isFree(c,r,z)) free.push([key, tile]);
  }
  for (let i = 0; i < free.length; i++)
    for (let j = i+1; j < free.length; j++)
      if (tilesMatch(free[i][1], free[j][1]))
        return [free[i][0], free[j][0]];
  return null;
}

// ── Game init ──────────────────────────────────────────────────
function startGame() {
  document.getElementById('overlay').style.display = 'none';
  newGame();
}

function newGame() {
  selected = null;
  moves = 0;
  hintPair = null;
  document.getElementById('move-count').textContent = '0';
  setStatus('Select a free tile');

  // Shuffle tile set and deal to positions
  const tiles = [...TILE_SET];
  shuffle(tiles);
  board = new Map();
  for (let i = 0; i < ALL_POSITIONS.length; i++) {
    const [c, r, z] = ALL_POSITIONS[i];
    board.set(pk(c, r, z), tiles[i]);
  }

  updatePairsLeft();
  renderBoard();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

// ── Shuffle remaining tiles ────────────────────────────────────
function doShuffle() {
  const keys = [...board.keys()];
  const tiles = [...board.values()];
  let attempts = 0;
  do {
    shuffle(tiles);
    board.clear();
    keys.forEach((k, i) => board.set(k, tiles[i]));
    attempts++;
  } while (!findHintPair() && attempts < 20);
  selected = null;
  hintPair = null;
  renderBoard();
  setStatus(attempts < 20 ? 'Board shuffled!' : 'Shuffled (no pairs found — try again)');
}

// ── Hint ──────────────────────────────────────────────────────
function showHint() {
  hintPair = findHintPair();
  if (!hintPair) {
    setStatus('No valid pairs — try shuffling');
    return;
  }
  setStatus('Hint shown ✦');
  renderBoard();
  // Auto-clear hint after 3s
  setTimeout(() => { hintPair = null; renderBoard(); setStatus('Select a free tile'); }, 3000);
}

// ── Click handler ─────────────────────────────────────────────
function clickTile(key) {
  const [c, r, z] = pkParse(key);
  if (!isFree(c, r, z)) { setStatus('Tile is locked — clear tiles above or beside it first'); return; }

  const tile = board.get(key);
  if (!tile) return;

  if (selected === null) {
    selected = key;
    hintPair = null;
    setStatus('Now click a matching free tile');
    renderBoard();
    return;
  }

  if (selected === key) {
    selected = null;
    setStatus('Select a free tile');
    renderBoard();
    return;
  }

  const selTile = board.get(selected);
  if (tilesMatch(selTile, tile)) {
    // Matched! Remove both
    const k1 = selected, k2 = key;
    selected = null;
    hintPair = null;

    // Animate removal
    const el1 = document.querySelector(`.tile[data-key="${k1}"]`);
    const el2 = document.querySelector(`.tile[data-key="${k2}"]`);
    if (el1) el1.classList.add('removing');
    if (el2) el2.classList.add('removing');

    setTimeout(() => {
      board.delete(k1);
      board.delete(k2);
      moves++;
      document.getElementById('move-count').textContent = moves;
      updatePairsLeft();

      if (board.size === 0) {
        renderBoard();
        showWin();
        return;
      }
      if (!findHintPair()) {
        renderBoard();
        showStuck();
        return;
      }
      setStatus('Select a free tile');
      renderBoard();
    }, 260);
  } else {
    // Mismatch — flash selected briefly then deselect
    setStatus('No match — try again');
    selected = key; // switch selection to new tile
    renderBoard();
  }
}

// ── Render ────────────────────────────────────────────────────
function renderBoard() {
  const container = document.getElementById('mahjong-board');
  container.innerHTML = '';

  // Board pixel dimensions
  const boardW = 11 * CELL_W + MAX_Z * LAYER_DX + TILE_W + 4;
  const boardH = 5 * CELL_H + TOP_OFFSET + TILE_H + 4;
  container.style.width = boardW + 'px';
  container.style.height = boardH + 'px';

  // Sort by z (ascending) so higher layers paint on top
  const entries = [...board.entries()].sort((a, b) => {
    const [ac,ar,az] = pkParse(a[0]), [bc,br,bz] = pkParse(b[0]);
    return az - bz || ar - br || ac - bc;
  });

  for (const [key, tile] of entries) {
    const [c, r, z] = pkParse(key);
    const free = isFree(c, r, z);

    const div = document.createElement('div');
    div.className = 'tile';
    div.dataset.key = key;

    div.style.left = (c * CELL_W + z * LAYER_DX) + 'px';
    div.style.top  = (r * CELL_H - z * LAYER_DY + TOP_OFFSET) + 'px';
    div.style.zIndex = z * 200 + r * 13 + c;

    if (!free) div.classList.add('locked');
    if (selected === key) div.classList.add('selected');
    if (hintPair && (hintPair[0] === key || hintPair[1] === key)) div.classList.add('hinted');

    div.style.color = tile.color;
    div.innerHTML = `<span class="tile-suit" style="color:${tile.color}">${tile.suit}</span>`
                  + `<span class="tile-val">${tile.text}</span>`;

    div.addEventListener('click', () => clickTile(key));
    container.appendChild(div);
  }
}

// ── Win / Stuck ───────────────────────────────────────────────
function showWin() {
  showOverlay(`<h2 style="color:#fbbf24">You Win! 🎉</h2>
    <p>All 72 pairs cleared in <strong>${moves}</strong> move${moves!==1?'s':''}!</p>
    <button class="btn" onclick="startNew()">Play Again</button>`);
}

function showStuck() {
  showOverlay(`<h2>No More Moves</h2>
    <p style="margin-bottom:12px">No free matching pairs remain.</p>
    <button class="btn" onclick="doShuffleAndClose()">Shuffle Tiles</button>
    <button class="btn secondary" onclick="startNew()">New Game</button>`);
}

function showOverlay(html) {
  const ov = document.getElementById('overlay');
  ov.querySelector('.panel').innerHTML = html;
  ov.style.display = 'flex';
}

function startNew() {
  document.getElementById('overlay').style.display = 'none';
  newGame();
}

function doShuffleAndClose() {
  document.getElementById('overlay').style.display = 'none';
  doShuffle();
}

// ── Helpers ───────────────────────────────────────────────────
function updatePairsLeft() {
  document.getElementById('pairs-left').textContent = board.size / 2;
}

function setStatus(msg) {
  document.getElementById('status-msg').textContent = msg;
}
</script>
</body>
</html>
