<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wordle</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: #1a1a2e;
  color: #e0e0e0;
  font-family: "Segoe UI", system-ui, sans-serif;
  padding: 24px 12px;
  gap: 16px;
}
h1 { margin: 0; color: #4ade80; letter-spacing: 4px; font-size: 28px; }
#streak { color: #94a3b8; font-size: 14px; }
#grid {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.row {
  display: flex;
  gap: 6px;
}
.tile {
  width: 56px;
  height: 56px;
  border: 2px solid #0f3460;
  background: #16213e;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: bold;
  text-transform: uppercase;
  border-radius: 4px;
  transition: border-color 0.1s;
  perspective: 200px;
}
.tile.filled { border-color: #94a3b8; }
.tile.flip {
  animation: flip 0.5s ease forwards;
}
.tile.correct { background: #4ade80; color: #16213e; border-color: #4ade80; }
.tile.present { background: #f59e0b; color: #16213e; border-color: #f59e0b; }
.tile.absent  { background: #374151; color: #e0e0e0; border-color: #374151; }
@keyframes flip {
  0%   { transform: rotateX(0deg); }
  50%  { transform: rotateX(-90deg); }
  100% { transform: rotateX(0deg); }
}
.row.shake {
  animation: shake 0.5s ease;
}
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20%      { transform: translateX(-8px); }
  40%      { transform: translateX(8px); }
  60%      { transform: translateX(-6px); }
  80%      { transform: translateX(6px); }
}
#keyboard {
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
}
.kb-row { display: flex; gap: 6px; }
.key {
  min-width: 36px;
  height: 52px;
  padding: 0 8px;
  background: #374151;
  color: #e0e0e0;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
  text-transform: uppercase;
  transition: background 0.2s, color 0.2s;
}
.key.wide { min-width: 54px; font-size: 11px; }
.key:hover { filter: brightness(1.2); }
.key.correct { background: #4ade80; color: #16213e; }
.key.present { background: #f59e0b; color: #16213e; }
.key.absent  { background: #1f2937; color: #6b7280; }
#message {
  min-height: 28px;
  font-size: 15px;
  font-weight: bold;
  color: #f87171;
  text-align: center;
}
#message.success { color: #4ade80; }
button.new-game {
  background: #4ade80;
  color: #16213e;
  border: none;
  padding: 10px 24px;
  font-size: 15px;
  font-weight: bold;
  border-radius: 6px;
  cursor: pointer;
  display: none;
}
button.new-game:hover { background: #22c55e; }
button.new-game.show { display: inline-block; }
</style>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>
<a href="../index.html" style="position:fixed;top:12px;left:12px;color:#94a3b8;text-decoration:none;font-size:13px;">← Back</a>

<button class="new-game" id="new-game-btn">New Game</button>

  "wrist","write","wrote","yacht","yearn","yeast","young","youth","zebra","zesty",
  "zippy","abbot","abbey","abide","abyss","acorn","acrid","adept","adorn","adept"
].filter((v,i,a)=>a.indexOf(v)===i && v.length===5);

const KB_ROWS = [
  ["q","w","e","r","t","y","u","i","o","p"],
  ["a","s","d","f","g","h","j","k","l"],
  ["Enter","z","x","c","v","b","n","m","⌫"]
];

let answer, currentRow, currentCol, board, keyState, gameOver, streak;

streak = Number(localStorage.getItem("wordleStreak") || 0);
document.getElementById("streak-val").textContent = streak;

function buildGrid() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  board = [];
  for (let r = 0; r < 6; r++) {
    const row = document.createElement("div");
    row.className = "row";
    const rowTiles = [];
    for (let c = 0; c < 5; c++) {
      const tile = document.createElement("div");
      tile.className = "tile";
      row.appendChild(tile);
      rowTiles.push(tile);
    }
    grid.appendChild(row);
    board.push({ el: row, tiles: rowTiles, letters: [] });
  }
}

function buildKeyboard() {
  KB_ROWS.forEach((keys, i) => {
    const row = document.getElementById(`kb-row-${i+1}`);
    row.innerHTML = "";
    keys.forEach(k => {
      const btn = document.createElement("button");
      btn.className = "key" + (k.length > 1 ? " wide" : "");
      btn.textContent = k;
      btn.dataset.key = k;
      btn.addEventListener("click", () => handleKey(k));
      row.appendChild(btn);
    });
  });
}

function init() {
  answer = WORDS[Math.floor(Math.random() * WORDS.length)].toUpperCase();
  currentRow = 0;
  currentCol = 0;
  gameOver = false;
  keyState = {};
  buildGrid();
  buildKeyboard();
  document.getElementById("message").textContent = "";
  document.getElementById("message").className = "";
  document.getElementById("new-game-btn").classList.remove("show");
}

function handleKey(key) {
  if (gameOver) return;
  if (key === "⌫" || key === "Backspace") {
    deleteLetter();
  } else if (key === "Enter") {
    submitGuess();
  } else if (/^[a-zA-Z]$/.test(key)) {
    addLetter(key.toUpperCase());
  }
}

function addLetter(letter) {
  if (currentCol >= 5) return;
  const tile = board[currentRow].tiles[currentCol];
  tile.textContent = letter;
  tile.classList.add("filled");
  board[currentRow].letters[currentCol] = letter;
  currentCol++;
}

function deleteLetter() {
  if (currentCol <= 0) return;
  currentCol--;
  const tile = board[currentRow].tiles[currentCol];
  tile.textContent = "";
  tile.classList.remove("filled");
  board[currentRow].letters[currentCol] = undefined;
}

function submitGuess() {
  if (currentCol < 5) {
    shakeRow();
    showMessage("Not enough letters");
    return;
  }
  const guess = board[currentRow].letters.join("");
  if (!WORDS.includes(guess.toLowerCase())) {
    shakeRow();
    showMessage("Not in word list");
    return;
  }
  const result = evaluate(guess);
  revealRow(result, guess);
}

function evaluate(guess) {
  const result = Array(5).fill("absent");
  const ansArr = answer.split("");
  const used = Array(5).fill(false);
  // correct pass
  for (let i = 0; i < 5; i++) {
    if (guess[i] === ansArr[i]) {
      result[i] = "correct";
      used[i] = true;
    }
  }
  // present pass
  for (let i = 0; i < 5; i++) {
    if (result[i] === "correct") continue;
    for (let j = 0; j < 5; j++) {
      if (!used[j] && guess[i] === ansArr[j]) {
        result[i] = "present";
        used[j] = true;
        break;
      }
    }
  }
  return result;
}

function revealRow(result, guess) {
  const tiles = board[currentRow].tiles;
  tiles.forEach((tile, i) => {
    setTimeout(() => {
      tile.style.animationDelay = "0s";
      tile.classList.add("flip");
      setTimeout(() => {
        tile.classList.add(result[i]);
        updateKey(guess[i], result[i]);
      }, 250);
      tile.addEventListener("animationend", () => tile.classList.remove("flip"), { once: true });
    }, i * 100);
  });
  setTimeout(() => {
    const won = result.every(r => r === "correct");
    currentRow++;
    currentCol = 0;
    if (won) {
      streak++;
      localStorage.setItem("wordleStreak", streak);
      document.getElementById("streak-val").textContent = streak;
      showMessage("Excellent! 🎉", true);
      gameOver = true;
      document.getElementById("new-game-btn").classList.add("show");
    } else if (currentRow === 6) {
      streak = 0;
      localStorage.setItem("wordleStreak", 0);
      document.getElementById("streak-val").textContent = 0;
      showMessage(`The word was ${answer}`, false);
      gameOver = true;
      document.getElementById("new-game-btn").classList.add("show");
    }
  }, 600);
}

const PRIORITY = { correct: 3, present: 2, absent: 1 };
function updateKey(letter, state) {
  const cur = keyState[letter];
  if (!cur || PRIORITY[state] > PRIORITY[cur]) {
    keyState[letter] = state;
    document.querySelectorAll(`.key`).forEach(btn => {
      if (btn.dataset.key && btn.dataset.key.toUpperCase() === letter) {
        btn.classList.remove("correct", "present", "absent");
        btn.classList.add(state);
      }
    });
  }
}

function shakeRow() {
  const row = board[currentRow].el;
  row.classList.add("shake");
  row.addEventListener("animationend", () => row.classList.remove("shake"), { once: true });
}

function showMessage(text, success = false) {
  const el = document.getElementById("message");
  el.textContent = text;
  el.className = success ? "success" : "";
}

document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  handleKey(e.key === "Backspace" ? "⌫" : e.key);
});

document.getElementById("new-game-btn").addEventListener("click", init);

buildKeyboard();
init();
</script>
